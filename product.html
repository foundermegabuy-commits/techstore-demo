<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product | TechStore BD</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/style.css">
<style>
/* ---------- Top product block ---------- */
.pd{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:36px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;margin-top:14px;box-shadow:var(--shadow)}
.gallery{display:flex;flex-direction:column;gap:14px;min-width:0}
.gmain{position:relative;aspect-ratio:1;border-radius:18px;background:radial-gradient(circle at 50% 40%,#fff,var(--soft-2) 75%);border:1px solid var(--line);overflow:hidden;cursor:zoom-in}
.gmain img{width:100%;height:100%;object-fit:contain;padding:8%;mix-blend-mode:multiply;transition:transform .25s ease,opacity .25s}
.gmain.zoom img{transform:scale(2.1)}
.gmain .badges{position:absolute;top:16px;left:16px;display:flex;flex-direction:column;gap:6px;z-index:2}
.gmain .hint{position:absolute;right:14px;bottom:14px;background:rgba(5,12,46,.75);backdrop-filter:blur(6px);color:#fff;font-size:11.5px;padding:6px 11px;border-radius:20px;display:flex;gap:7px;align-items:center;transition:.2s;pointer-events:none}
.gmain.zoom .hint{opacity:0}
.gmain .garr{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:0 6px 16px rgba(5,12,46,.12);color:var(--ink);z-index:2;opacity:0;transition:.2s}
.gmain:hover .garr{opacity:1}
.gmain .garr:hover{background:var(--orange);color:#fff}
.gmain .garr.p{left:12px}.gmain .garr.n{right:12px}
.gthumbs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px}
.gthumbs::-webkit-scrollbar{display:none}
.gthumbs button{flex:none;width:84px;height:84px;border-radius:14px;border:2px solid var(--line);background:var(--soft);padding:6px;transition:.2s}
.gthumbs button img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.gthumbs button:hover{border-color:#FFC3A8}
.gthumbs button.on{border-color:var(--orange);box-shadow:0 6px 16px rgba(255,74,3,.18)}

.info{min-width:0}
.info .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bchip{display:inline-flex;align-items:center;gap:7px;background:var(--orange-soft);color:var(--orange);font-weight:600;font-size:12px;letter-spacing:.6px;text-transform:uppercase;padding:5px 12px;border-radius:20px}
.info h1{font-size:25px;line-height:1.3;font-weight:700;letter-spacing:-.3px;margin:12px 0 10px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:12.5px;color:var(--muted)}
.meta .rating{font-size:13px}
.meta a:hover{color:var(--orange)}
.meta b{color:var(--text);font-weight:500}
.meta .sep{width:1px;height:14px;background:var(--line)}
.pbox{margin:18px 0;padding:18px 20px;border-radius:16px;background:linear-gradient(135deg,#FFF7F2,#FFF1EA);border:1px solid #FFE0D0}
.pbox .now{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.pbox .now b{font-size:32px;font-weight:800;color:var(--ink);letter-spacing:-.5px;line-height:1.1}
.pbox .now s{font-size:16px;color:#9AA0BC}
.pbox .now .save{font-size:12px}
.pbox .emi{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:#2A3150;flex-wrap:wrap}
.pbox .emi i{color:var(--orange)}
.pbox .emi b{color:var(--orange)}
.pbox .emi a{color:var(--ink);font-weight:600;text-decoration:underline;font-size:12px}
.kf h3{font-size:14px;font-weight:600;margin-bottom:10px}
.kf ul{list-style:none;display:grid;gap:8px}
.kf li{display:flex;gap:10px;font-size:13.5px;color:#2A3150}
.kf li i{width:20px;height:20px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:10px;background:#E6F6EE;color:var(--green);margin-top:1px}
.kf li span b{font-weight:600;color:var(--text)}
.kf .more{display:inline-flex;gap:6px;align-items:center;color:var(--orange);font-weight:600;font-size:12.5px;margin-top:10px;cursor:pointer}
.buyrow{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center}
.buyrow .qty{height:50px}
.buyrow .qty button{width:42px}
.buyrow .btn{height:50px;flex:1;min-width:140px}
.icon-btn{width:50px;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;transition:.2s;flex:none}
.icon-btn:hover{border-color:var(--orange);color:var(--orange)}
.icon-btn.on{background:var(--orange);border-color:var(--orange);color:#fff}
.secondary{display:flex;gap:18px;margin-top:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.secondary a{display:flex;gap:7px;align-items:center}
.secondary a:hover{color:var(--orange)}
.perks{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.perks div{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#FFF6F1,var(--soft));border:1px solid #F1E6E0;transition:.2s}
.perks div:hover{border-color:#FFC9AE;box-shadow:0 8px 20px rgba(255,74,3,.08)}
.perks i{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff;font-size:15px;box-shadow:0 6px 14px rgba(255,74,3,.25)}
.perks b{display:block;font-size:13px;font-weight:600;line-height:1.3}
.perks span{font-size:11.5px;color:var(--muted);line-height:1.4}
@media (max-width:480px){.perks{grid-template-columns:1fr}}

/* ---------- Tabs area ---------- */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;margin-top:28px;align-items:start}
.ptabs{position:sticky;top:136px;z-index:5;display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;overflow-x:auto;scrollbar-width:none;box-shadow:0 8px 20px rgba(5,12,46,.05)}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:none;padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--muted);transition:.2s;display:flex;gap:8px;align-items:center}
.ptabs button small{font-size:10.5px;background:var(--soft-2);color:var(--muted);border-radius:10px;padding:0 7px;font-weight:600}
.ptabs button:hover{color:var(--ink)}
.ptabs button.on{background:var(--navy);color:#fff}
.ptabs button.on small{background:var(--orange);color:#fff}
.pane{display:none;margin-top:14px}
.pane.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pane h3{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.pane h3::before{content:"";width:5px;height:20px;border-radius:3px;background:linear-gradient(var(--orange),var(--orange-2))}
.spec{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:13.5px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.spec th.g{background:var(--navy);color:#fff;text-align:left;padding:10px 16px;font-size:12.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.spec th.g i{color:var(--orange-2);margin-right:8px}
.spec td{overflow-wrap:anywhere;padding:11px 16px;border-top:1px solid var(--line);vertical-align:top}
.spec td:first-child{width:32%;color:var(--muted);background:var(--soft);font-weight:500}
.spec tr.first td{border-top:0}
.desc p{color:#3A4160;line-height:1.85;font-size:14px}
.desc p+p{margin-top:12px}
.desc h4{font-size:15px;margin:22px 0 10px}
.hl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.hl div{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:16px}
.hl i{font-size:20px;color:var(--orange);margin-bottom:8px}
.hl b{display:block;font-size:13.5px}
.hl span{font-size:12px;color:var(--muted)}
.wlist{list-style:none;display:grid;gap:12px}
.wlist li{display:flex;gap:12px;font-size:13.5px;color:#3A4160}
.wlist li i{color:var(--orange);margin-top:4px}
.wcard{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--navy),var(--navy-3));color:#fff;border-radius:16px;padding:20px;margin-bottom:20px}
.wcard .big{font-size:34px;font-weight:800;color:var(--gold);line-height:1}
.wcard small{display:block;font-size:11px;color:#9CA3C7;letter-spacing:1.5px;text-transform:uppercase}
.wcard p{font-size:13px;color:#B4BAD8}

/* reviews */
.rsum{display:grid;grid-template-columns:200px 1fr auto;gap:28px;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line)}
.rsum .avg{text-align:center}
.rsum .avg b{font-size:48px;font-weight:800;line-height:1;color:var(--ink)}
.rsum .avg .rating{justify-content:center;font-size:15px;margin:6px 0 2px}
.rsum .avg span{font-size:12px;color:var(--muted)}
.bars{display:grid;gap:8px}
.bars div{display:grid;grid-template-columns:40px 1fr 40px;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.bars div i{color:#F5A623;font-size:10px}
.bars .bar{height:8px;border-radius:4px;background:#EEF0F6;overflow:hidden}
.bars .bar span{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#F5A623,#FFC24B)}
.rvw{display:flex;gap:14px;padding:20px 0;border-bottom:1px solid var(--line)}
.rvw .av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy-3))}
.rvw .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rvw .hd b{font-size:14px}
.rvw .hd .pill{font-size:10.5px;padding:2px 8px}
.rvw .hd time{font-size:12px;color:var(--muted);margin-left:auto}
.rvw p{font-size:13.5px;color:#3A4160;margin-top:6px;line-height:1.7}
.rvw .helpful{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted)}
.rvw .helpful button{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center}
.rvw .helpful button:hover{color:var(--orange)}
.rform{margin-top:24px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:20px}
.rform h4{font-size:15px;margin-bottom:4px}
.rform>p{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.starpick{display:flex;gap:6px;margin-bottom:14px;align-items:center}
.starpick button{font-size:22px;color:#D5DAEA;transition:.15s}
.starpick button.on{color:#F5A623}
.starpick span{font-size:12.5px;color:var(--muted);margin-left:8px}

/* Q&A */
.qa{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.qa summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-weight:500;font-size:14px}
.qa summary::-webkit-details-marker{display:none}
.qa summary .q{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--orange-soft);color:var(--orange);font-weight:700;font-size:12px}
.qa summary .chev{margin-left:auto;color:var(--muted);font-size:12px;transition:.25s;margin-top:6px}
.qa[open] summary .chev{transform:rotate(180deg)}
.qa .a{display:flex;gap:12px;padding:0 16px 16px;font-size:13.5px;color:#3A4160;line-height:1.7}
.qa .a .q{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;background:#E6F6EE;color:var(--green);font-weight:700;font-size:12px}
.qa .a small{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
.askf{display:flex;gap:10px;margin-top:18px}
.askf input{flex:1;min-width:0;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 16px;font-family:inherit;font-size:14px;outline:0;background:var(--soft)}
.askf input:focus{border-color:var(--orange);background:var(--card)}

/* side */
.side{display:grid;gap:16px;position:sticky;top:136px}
.help{background:linear-gradient(135deg,var(--navy),var(--navy-3));color:#fff;border-radius:var(--radius);padding:22px;position:relative;overflow:hidden}
.help::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(rgba(255,74,3,.5),transparent 65%)}
.help small{color:var(--gold);font-size:11px;letter-spacing:1.5px;font-weight:600}
.help h4{font-size:18px;margin:4px 0 6px}
.help p{color:#B4BAD8;font-size:12.5px}
.help .btn{margin-top:14px;height:42px;position:relative;z-index:1}
.minis{display:grid;gap:12px}
.mini{display:flex;gap:12px;align-items:center}
.mini img{width:62px;height:62px;border-radius:12px;background:var(--soft);object-fit:contain;padding:5px;flex:none;mix-blend-mode:multiply}
.mini b{font-size:12.5px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini span{font-size:13px;font-weight:700;color:var(--orange)}
.mini:hover b{color:var(--orange)}

.card .stock.pre{color:#C77700}.card .stock.pre::before{background:#F5A623}
#notFound{margin-top:20px}

@media (max-width:1200px){
  .detail{grid-template-columns:minmax(0,1fr) 270px}
}
@media (max-width:992px){
  .pd{grid-template-columns:1fr;gap:26px}
  .gallery{max-width:560px;width:100%;margin:0 auto}
  .detail{grid-template-columns:minmax(0,1fr)}
  .side{position:static;grid-template-columns:1fr 1fr}
  .rsum{grid-template-columns:160px 1fr}
  .rsum>.btn{grid-column:1/-1}
}
@media (max-width:640px){
  .pd{padding:14px;border-radius:18px}
  .gthumbs button{width:66px;height:66px;border-radius:12px}
  .gmain .garr{opacity:1;width:34px;height:34px}
  .gmain .hint{display:none}
  .info h1{font-size:19px}
  .pbox{padding:14px 16px}
  .pbox .now b{font-size:26px}
  .buyrow .qty{order:0}
  .buyrow .btn{flex:1 1 100%;order:2}
  .buyrow .icon-btn{order:1}
  .buyrow .qty{flex:1}
  .buyrow .qty input{flex:1}
  .ptabs{position:static}
  .ptabs button{padding:9px 13px;font-size:12.5px}
  .spec td{padding:9px 12px;font-size:12.5px}
  .spec td:first-child{width:40%}
  .hl{grid-template-columns:1fr}
  .rsum{grid-template-columns:1fr;gap:16px}
  .rvw .hd time{margin-left:0;flex-basis:100%}
  .side{grid-template-columns:1fr}
  .askf{flex-direction:column}
}

/* ---------- Dark-mode friendly surfaces ---------- */
.pd,.ptabs,.icon-btn{background:var(--card)}
.rform{background:var(--bg)}
.card .stock.low{color:#D33}.card .stock.low::before{background:#D33}

/* ---------- Stock urgency / pre-order ---------- */
.urg{margin:-4px 0 18px;padding:12px 14px;border-radius:14px;border:1px solid rgba(221,51,51,.22);background:linear-gradient(135deg,rgba(221,51,51,.07),rgba(255,74,3,.04))}
.urg-h{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:13px}
.urg-h b{color:#D33;display:flex;gap:7px;align-items:center;font-weight:600}
.urg-h b i{animation:flick 1.6s ease-in-out infinite}
.urg-h span{margin-left:auto;color:var(--muted);font-size:12px;display:flex;gap:7px;align-items:center}
.urg-h span em{width:7px;height:7px;border-radius:50%;background:var(--green);animation:livedot 1.6s infinite}
.urg-bar{height:7px;border-radius:5px;background:var(--line);margin-top:9px;overflow:hidden}
.urg-bar span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#D33,var(--orange-2))}
@keyframes flick{50%{transform:scale(1.18) rotate(-6deg)}}
@keyframes livedot{0%{box-shadow:0 0 0 0 rgba(1,144,69,.5)}100%{box-shadow:0 0 0 7px rgba(1,144,69,0)}}
.preinfo{margin:-4px 0 18px;padding:11px 14px;border-radius:14px;border:1px solid rgba(199,119,0,.25);background:rgba(245,166,35,.08);font-size:12.5px;color:var(--text);display:flex;gap:10px;align-items:flex-start}
.preinfo i{color:#C77700;margin-top:3px}

/* ---------- WhatsApp / notify / alert chip ---------- */
.buy2{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.buy2 .btn{flex:1;min-width:190px;height:46px}
.btn.wa{background:#25D366;color:#fff;box-shadow:0 8px 20px rgba(37,211,102,.25)}
.btn.wa:hover{background:#1EBE5A;transform:translateY(-1px)}
.btn.wa i{font-size:18px}
.btn.notify{background:var(--card);border:1.5px dashed var(--orange);color:var(--orange)}
.btn.notify:hover{background:rgba(255,74,3,.06)}
.nchip{display:inline-flex;align-items:center;gap:8px;margin:12px 8px 0 0;padding:5px 6px 5px 12px;border-radius:20px;background:rgba(1,144,69,.1);color:var(--green);font-size:12px;font-weight:600}
.nchip button{width:22px;height:22px;border-radius:50%;color:inherit;font-size:11px}
.nchip button:hover{background:rgba(1,144,69,.18)}

/* ---------- Alert modal ---------- */
.al-prod{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;margin-bottom:18px;background:var(--bg)}
.al-prod img{width:52px;height:52px;object-fit:contain;border-radius:10px;background:var(--card);padding:4px;flex:none}
.al-prod b{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;font-weight:600}
.al-prod span{font-size:12px;color:var(--muted)}
.al-prod em{font-style:normal;color:var(--orange);font-weight:700}
.al-in{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card);transition:.2s}
.al-in:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,74,3,.12)}
.al-in span{display:grid;place-items:center;padding:0 12px;background:var(--bg);color:var(--muted);font-weight:600;font-size:13px;border-right:1px solid var(--line)}
.field .al-in input{border:0;border-radius:0;box-shadow:none;background:transparent;color:var(--text)}
.al-in.bad{border-color:#D33}
.field small{font-size:11.5px;color:var(--muted)}
.field small.al-err{color:#D33}
.field .opt{color:var(--muted);font-weight:400}
.al-ch{display:flex;gap:10px;margin:6px 0 18px}
.al-ch label{flex:1;display:flex;gap:9px;align-items:center;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;font-size:13px;font-weight:500;transition:.2s}
.al-ch input{accent-color:var(--orange);width:16px;height:16px}
.al-ch label .fa-whatsapp{color:#25D366}.al-ch label .fa-comment-sms{color:#0381C5}
.al-ch label:has(input:checked){border-color:var(--orange);background:rgba(255,74,3,.06)}
.al-ok{text-align:center;padding:16px 4px 4px}
.al-ok>span{width:68px;height:68px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:28px;color:#fff;background:linear-gradient(135deg,#19B45F,var(--green));box-shadow:0 12px 26px rgba(1,144,69,.3);animation:pop .4s ease}
.al-ok h3{font-size:19px;font-weight:700;margin-bottom:6px}
.al-ok p{font-size:13px;color:var(--muted);margin-bottom:18px}
@keyframes pop{from{transform:scale(.5);opacity:0}}

/* ---------- Frequently bought together ---------- */
.fbt{margin-top:22px;padding:22px 24px}
.fbt-h{margin-bottom:16px}
.fbt-h h3{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;margin:0 0 2px}
.fbt-h h3::before{content:"";width:5px;height:20px;border-radius:3px;background:linear-gradient(var(--orange),var(--orange-2))}
.fbt-h p{font-size:12.5px;color:var(--muted);padding-left:15px}
.fbt-body{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px;align-items:center}
.fbt-items{display:flex;align-items:stretch;min-width:0}
.fbt-it{flex:1 1 0;min-width:0;position:relative;border:1.5px solid var(--line);border-radius:16px;padding:12px;background:var(--card);transition:.2s;display:flex;flex-direction:column;cursor:pointer}
.fbt-it input{position:absolute;opacity:0;pointer-events:none}
.fbt-it.on{border-color:var(--orange);box-shadow:0 8px 22px rgba(255,74,3,.1)}
.fbt-it:not(.on) .fbt-img,.fbt-it:not(.on) .fbt-tx{opacity:.45}
.fbt-it.main{cursor:default}

  $$("[data-scroll]").forEach(b => b.addEventListener("click", e => { e.preventDefault(); $("#" + b.dataset.scroll).scrollIntoView({behavior:"smooth", block:"center"}); }));

  /* ---------- Sticky buy bar ---------- */
  document.body.insertAdjacentHTML("beforeend", `<div class="sbar" id="sbar" aria-hidden="true"><div class="wrap sbar-in">
    <img src="img/${x.i}" alt="">
    <div class="sb-t"><b>${esc(x.n)}</b><span><em>${tk(x.p)}</em>${x.o > x.p ? `<s>${tk(x.o)}</s>` : ""}<i class="${stk.pre ? "pre" : stk.low ? "low" : ""}">${esc(stk.text)}</i></span></div>
    <div class="sb-btns"><button class="btn dark" id="sbAdd" type="button" aria-label="Add to cart"><i class="fa-solid fa-cart-plus"></i><span>Add to Cart</span></button><button class="btn primary" id="sbBuy" type="button"><i class="fa-solid fa-bolt"></i>${stk.pre ? "Pre-Order" : "Buy Now"}</button></div>
  </div></div>`);
  $("#sbAdd").onclick = () => addCart(id, getQ());
  $("#sbBuy").onclick = () => addCart(id, getQ(), true);
  (() => {
    const sb = $("#sbar"), hdr = $("header.main"), target = $(".buyrow"), mob = matchMedia("(max-width:768px)"), root = document.documentElement;
    const hh = () => hdr ? Math.round(hdr.getBoundingClientRect().height) : 0;
    const sync = () => {
      const h = hh(), on = sb.classList.contains("show") && !mob.matches;
      root.style.setProperty("--sbTop", h + "px");
      root.style.setProperty("--stickTop", (h + 22 + (on ? sb.offsetHeight : 0)) + "px");
    };
    const set = on => {
      if (sb.classList.contains("show") === on) return;
      sb.classList.toggle("show", on); sb.setAttribute("aria-hidden", String(!on));
      document.body.classList.toggle("sbar-on", on); sync();
    };
    let io, lastH = -1;
    const watch = () => {
      const h = hh(); if (h === lastH) return; lastH = h;
      if (io) io.disconnect();
      // the buttons count as "visible" only below the sticky header
      io = new IntersectionObserver(([en]) => set(!en.isIntersecting && en.boundingClientRect.top < innerHeight / 2), {rootMargin: `-${h}px 0px 0px 0px`});
      io.observe(target);
    };
    if (hdr && "ResizeObserver" in window) new ResizeObserver(() => { sync(); watch(); }).observe(hdr);
    mob.addEventListener ? mob.addEventListener("change", sync) : mob.addListener(sync);
    sync(); watch();
  })();

  /* ---------- Price-drop / back-in-stock alerts ---------- */
  const getAlerts = () => (Array.isArray(store.get("alerts", [])) ? store.get("alerts", []) : []);
  const myAlerts = () => getAlerts().filter(a => +a.id === id);
  function renderAlertChip(){
    $("#alertChip").innerHTML = myAlerts().map(a => `<span class="nchip"><i class="fa-solid fa-bell"></i>You'll be notified${a.type === "stock" ? " when it's available" : " on price drop" + (a.target ? " below " + tk(a.target) : "")}<button type="button" data-unalert="${a.type}" aria-label="Cancel alert" title="Cancel alert"><i class="fa-solid fa-xmark"></i></button></span>`).join("");
    const pa = $("#priceAlert"); if (pa) pa.innerHTML = `<i class="fa-${myAlerts().some(a => a.type === "price") ? "solid" : "regular"} fa-bell"></i>Price drop alert`;
  }
  $("#alertChip").addEventListener("click", e => {
    const b = e.target.closest("[data-unalert]"); if (!b) return;
    store.set("alerts", getAlerts().filter(a => !(+a.id === id && a.type === b.dataset.unalert)));
    renderAlertChip(); toast("Alert removed");
  });
  const closeAlert = () => { const m = $("#alertM"); if (m && m.classList.contains("open")) { m.classList.remove("open"); lockScroll(false); } };
  function openAlert(type){
    let m = $("#alertM");
    if (!m) {
      document.body.insertAdjacentHTML("beforeend", '<div class="qv emi-m" id="alertM" role="dialog" aria-modal="true"><div class="qv-box emi-box"></div></div>');
      m = $("#alertM");
      m.addEventListener("click", e => { if (e.target === m || e.target.closest(".qv-x") || e.target.closest("#alDone")) closeAlert(); });
    }
    const box = $(".emi-box", m), price = type === "price";
    const ex = myAlerts().find(a => a.type === type) || {}, u = store.get("user", null) || {};
    box.innerHTML = `
      <button class="qv-x" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      <div class="emi-h"><i class="fa-solid ${price ? "fa-arrow-trend-down" : "fa-bell"}"></i><div><h3>${price ? "Price Drop Alert" : "Notify Me When Available"}</h3><p>${price ? "We'll message you as soon as the price goes down" : "We'll message you the moment it's back in stock"}</p></div></div>
      <div class="al-prod"><img src="img/${x.i}" alt=""><div><b>${esc(x.n)}</b><span>Current price <em>${tk(x.p)}</em></span></div></div>
      <form id="alForm" novalidate>
        <div class="field"><label for="alPhone">Mobile number</label><div class="al-in" id="alPhoneW"><span>+88</span><input id="alPhone" inputmode="numeric" autocomplete="tel" maxlength="14" placeholder="01XXXXXXXXX" value="${esc(ex.phone || u.phone || "")}"></div><small class="al-err" id="alErr"></small></div>
        ${price ? `<div class="field"><label for="alTarget">Target price <span class="opt">(optional)</span></label><div class="al-in" id="alTargetW"><span>৳</span><input id="alTarget" inputmode="numeric" placeholder="e.g. ${Math.round(x.p * .9 / 100) * 100}" value="${ex.target || ""}"></div><small id="alTErr">Leave empty to be notified of any price drop.</small></div>` : ""}
        <label class="emi-l">Notify me via</label>
        <div class="al-ch"><label><input type="checkbox" value="SMS" ${!ex.via || ex.via.includes("SMS") ? "checked" : ""}><i class="fa-solid fa-comment-sms"></i>SMS</label><label><input type="checkbox" value="WhatsApp" ${ex.via && ex.via.includes("WhatsApp") ? "checked" : ""}><i class="fa-brands fa-whatsapp"></i>WhatsApp</label></div>
        <button class="btn primary block"><i class="fa-solid fa-bell"></i>${ex.phone ? "Update alert" : "Notify me"}</button>
      </form>`;
    $("#alForm").addEventListener("submit", e => {
      e.preventDefault();
      const phone = $("#alPhone").value.replace(/[\s-]/g, "").replace(/^\+?88/, "");
      const okPhone = /^01[3-9]\d{8}$/.test(phone);
      $("#alPhoneW").classList.toggle("bad", !okPhone);
      $("#alErr").textContent = okPhone ? "" : "Enter a valid Bangladeshi number, e.g. 01712345678";
      let target = null;
      if (price) {
        const raw = $("#alTarget").value.replace(/[৳,\s]/g, "");
        target = raw ? Math.round(+raw) : null;
        const okT = !raw || (target > 0 && target < x.p);
        $("#alTargetW").classList.toggle("bad", !okT);
        $("#alTErr").className = okT ? "" : "al-err";
        $("#alTErr").textContent = okT ? "Leave empty to be notified of any price drop." : `Target price must be lower than ${tk(x.p)}`;
        if (!okT) return;
      }
      if (!okPhone) return;
      const via = $$(".al-ch input:checked", box).map(i => i.value);
      if (!via.length) { toast("Choose SMS or WhatsApp"); return; }
      store.set("alerts", [...getAlerts().filter(a => !(+a.id === id && a.type === type)), {id, type, phone, target, via, date:new Date().toISOString()}]);
      renderAlertChip();
      box.innerHTML = `<button class="qv-x" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        <div class="al-ok"><span><i class="fa-solid fa-check"></i></span><h3>You're on the list!</h3>
        <p>We'll send ${via.join(" &amp; ")} to <b>${phone}</b> ${price ? (target ? `when the price drops below <b>${tk(target)}</b>` : "as soon as the price drops") : "as soon as it's back in stock"}.</p>
        <button class="btn dark" id="alDone" type="button">Done</button></div>`;
    });
    m.classList.add("open"); lockScroll(true);
    setTimeout(() => { const p = $("#alPhone"); if (p && !p.value) p.focus(); }, 250);
  }
  $("#priceAlert").addEventListener("click", e => { e.preventDefault(); openAlert("price"); });
  if ($("#notifyBtn")) $("#notifyBtn").addEventListener("click", () => openAlert("stock"));
  renderAlertChip();

  /* ---------- Bundle ---------- */
  const fbtSel = () => $$("#fbt input:checked").map(i => +i.dataset.id);
  function fbtRender(){
    $$("#fbt .fbt-it").forEach(l => l.classList.toggle("on", l.querySelector("input").checked));
    const sel = fbtSel(), all = sel.length === bIds.length;
    const sum = sel.reduce((s, k) => s + P[k].p, 0), orig = sel.reduce((s, k) => s + P[k].o, 0);
    const extra = all && bIds.length > 1 ? Math.round(sum * .05) : 0;
    const full = bIds.reduce((s, k) => s + P[k].p, 0);
    $("#fbtInfo").innerHTML = `<small>${all ? "Bundle price" : "Total price"} for ${sel.length} item${sel.length > 1 ? "s" : ""}</small>
      <div class="fbt-p"><b>${tk(sum - extra)}</b>${orig > sum - extra ? `<s>${tk(orig)}</s>` : ""}</div>
      ${extra ? `<span class="fbt-extra"><i class="fa-solid fa-gift"></i>Save ${tk(extra)} extra</span>` : `<span class="fbt-hint">Select all ${bIds.length} to save an extra <b>${tk(Math.round(full * .05))}</b></span>`}`;
    $("#fbtAdd span").textContent = sel.length > 1 ? `Add ${sel.length} items to cart` : "Add to cart";
  }
  $("#fbt").addEventListener("change", fbtRender);
  $("#fbtAdd").addEventListener("click", () => {
    const sel = fbtSel();
    const c = getCart(); sel.forEach(k => c[k] = (c[k] || 0) + 1); store.set("cart", c); updateCounts(); // add all, open the drawer once
    if (sel.length === bIds.length && sel.length > 1) store.set("bundle", {ids:sel, off:Math.round(sel.reduce((s, k) => s + P[k].p, 0) * .05), date:new Date().toISOString()});
    if (sel.length === bIds.length && sel.length > 1 && !store.get("coupon", null)) store.set("coupon", "BUNDLE5");
    openMiniCart(); toast(sel.length > 1 ? `${sel.length} items added${sel.length === bIds.length ? " · 5% bundle discount applied at checkout" : ""}` : "Product added to cart");
  });
  fbtRender();

  /* ---------- Review list, filters & lightbox ---------- */
  let revs = [...userRevs, ...SAMPLE], rf = "all";
  function renderRevs(){
    const list = revs.filter(r => rf === "all" || (rf === "ph" ? safePh(r.ph).length : r.r === +rf));
    $("#revList").innerHTML = list.length ? list.map(revHTML).join("") : `<div class="rv-empty"><i class="fa-regular fa-image"></i> No reviews match this filter yet.</div>`;
    $$("#rfilt button").forEach(b => b.classList.toggle("on", b.dataset.f === rf));
    $("#phCnt").textContent = revs.filter(r => safePh(r.ph).length).length;
  }
  $("#rfilt").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { rf = b.dataset.f; renderRevs(); } });
  renderRevs();

  document.body.insertAdjacentHTML("beforeend", `<div class="plb" id="plb" role="dialog" aria-modal="true" aria-label="Review photo"><button class="x" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button><button class="p" type="button" aria-label="Previous photo"><i class="fa-solid fa-chevron-left"></i></button><img alt="Review photo"><button class="n" type="button" aria-label="Next photo"><i class="fa-solid fa-chevron-right"></i></button><div class="c"></div></div>`);
  const lb = $("#plb"); let lbList = [], lbK = 0;
  const lbShow = k => { lbK = (k + lbList.length) % lbList.length; $("img", lb).src = lbList[lbK]; $(".c", lb).textContent = `${lbK + 1} / ${lbList.length}`; $$(".p,.n", lb).forEach(b => b.style.display = lbList.length > 1 ? "" : "none"); };
  const closeLB = () => { if (lb.classList.contains("open")) { lb.classList.remove("open"); lockScroll(false); } };
  $("#revList").addEventListener("click", e => {
    const b = e.target.closest("[data-lb]"); if (!b) return;
    lbList = $$("img", b.parentElement).map(i => i.src); lbShow(+b.dataset.lb); lb.classList.add("open"); lockScroll(true);
  });
  lb.addEventListener("click", e => {
    if (e.target.closest(".p")) lbShow(lbK - 1); else if (e.target.closest(".n")) lbShow(lbK + 1);
    else if (e.target === lb || e.target.closest(".x")) closeLB();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeAlert(); closeLB(); }
    if (lb.classList.contains("open") && (e.key === "ArrowLeft" || e.key === "ArrowRight")) lbShow(lbK + (e.key === "ArrowRight" ? 1 : -1));
  });

  /* ---------- Review photo upload (downscaled to ~400px JPEG) ---------- */
  let rPh = [];
  const MAXPH = 4;
  const downscale = file => new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const s = Math.min(1, 400 / Math.max(im.width, im.height)), cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(im.width * s)); cv.height = Math.max(1, Math.round(im.height * s));
        const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0, cv.width, cv.height);
        res(cv.toDataURL("image/jpeg", .72));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
  function renderPh(){
    $("#rprev").innerHTML = rPh.map((s, k) => `<div><img src="${s}" alt="Photo ${k + 1}"><button type="button" data-rm="${k}" aria-label="Remove photo ${k + 1}"><i class="fa-solid fa-xmark"></i></button></div>`).join("");
    $("#rdrop").classList.toggle("full", rPh.length >= MAXPH);
    $("#phN").textContent = rPh.length + "/" + MAXPH;
  }
  async function addPhotos(files){
    const list = [...files].filter(f => /^image\//.test(f.type));
    if (!list.length) { if (files.length) toast("Please choose image files"); return; }
    const room = MAXPH - rPh.length;
    if (list.length > room) toast(`Up to ${MAXPH} photos, extra ones were skipped`);
    for (const f of list.slice(0, room)) { try { rPh.push(await downscale(f)); } catch { toast("Couldn't read " + f.name); } }
    renderPh();
  }
  const drop = $("#rdrop");
  $("#rfile").addEventListener("change", e => { addPhotos(e.target.files); e.target.value = ""; });
  ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("drag"); }));
  ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("drag"); }));
  drop.addEventListener("drop", e => addPhotos(e.dataTransfer.files));
  $("#rprev").addEventListener("click", e => { const b = e.target.closest("[data-rm]"); if (b) { rPh.splice(+b.dataset.rm, 1); renderPh(); } });

  /* ---------- Review form ---------- */
  let pick = 0;
  const LABELS = ["", "Poor", "Fair", "Good", "Very good", "Excellent"];
  const paint = n => $$("#starpick button").forEach(b => b.classList.toggle("on", +b.dataset.s <= n));
  $("#starpick").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; pick = +b.dataset.s; paint(pick); $("#starTxt").textContent = LABELS[pick]; });
  $("#starpick").addEventListener("mouseover", e => { const b = e.target.closest("button"); if (b) paint(+b.dataset.s); });
  $("#starpick").addEventListener("mouseleave", () => paint(pick));
  $("#rform").addEventListener("submit", e => {
    e.preventDefault();
    if (!pick) { toast("Please select a star rating"); return; }
    const r = {n:$("#rn").value.trim(), r:pick, d:new Date().toLocaleDateString("en-GB", {day:"2-digit", month:"short", year:"numeric"}), t:esc($("#rt").value.trim())};
    if (rPh.length) r.ph = rPh.slice();
    const all = store.get("reviews", {}); all[id] = [r, ...(all[id] || [])]; store.set("reviews", all);
    let msg = "Thanks! Your review has been posted";
    if (r.ph && (store.get("reviews", {})[id] || []).length !== all[id].length) { // storage full: keep the review, drop the photos
      delete r.ph; store.set("reviews", all); msg = "Review posted, but photos were too large to save";
    }
    revs.unshift(r); rf = "all"; renderRevs();
    const total = cnt + all[id].length;
    $("#revN").textContent = total; $("#revBase").textContent = `Based on ${total} reviews`;
    e.target.reset(); pick = 0; paint(0); $("#starTxt").textContent = "Select a rating";
    rPh = []; renderPh();
    toast(msg);
    $("#revList").scrollIntoView({behavior:"smooth", block:"start"});
  });
  $("#askf").addEventListener("submit", e => {
    e.preventDefault();
    const q = $("#askq").value.trim();
    $("#qaList").insertAdjacentHTML("afterbegin", `<details class="qa" open><summary><span class="q">Q</span><span>${esc(q)}</span><i class="fa-solid fa-chevron-down chev"></i></summary><div class="a"><span class="q" style="background:#FFF4E0;color:#C77700"><i class="fa-regular fa-clock"></i></span><div>Thanks for asking! Our team will answer within 24 hours.<small>Pending answer</small></div></div></details>`);
    $("#qaN").textContent = +$("#qaN").textContent + 1;
    e.target.reset(); toast("Your question has been submitted");
  });

  /* ---------- Side: more from brand ---------- */
  const ids = Object.keys(P).map(Number).filter(k => k !== id);
  let brandIds = ids.filter(k => P[k].b === x.b);
  if (brandIds.length < 3) brandIds = [...brandIds, ...ids.filter(k => P[k].c === x.c && !brandIds.includes(k))];
  if (brandIds.length < 3) brandIds = [...brandIds, ...ids.filter(k => !brandIds.includes(k))];
  $("#minis").innerHTML = brandIds.slice(0, 4).map(k => `<a class="mini" href="product.html?id=${k}"><img src="img/${P[k].i}" alt=""><div><b>${esc(P[k].n)}</b><span>${tk(P[k].p)}</span></div></a>`).join("");

  /* ---------- Related & recent ---------- */
  let rel = ids.filter(k => P[k].c === x.c);
  if (rel.length < 6) rel = [...rel, ...ids.filter(k => !rel.includes(k)).sort((a, b) => Math.abs(P[a].p - x.p) - Math.abs(P[b].p - x.p))].slice(0, 8);
  $("#r-rel").innerHTML = rel.map(rcard).join("");

  const recent = store.get("recent", []).map(Number).filter(k => k !== id && P[k]);
  if (recent.length) { $("#recentSec").hidden = false; $("#r-recent").innerHTML = recent.slice(0, 10).map(rcard).join(""); }
  store.set("recent", [id, ...recent].slice(0, 12));

  markTools();
})();
</script>
</body>
</html>
