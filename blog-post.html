<style>

/* Head */
.ph{max-width:860px;margin:18px auto 0;text-align:center}
.ph .pill{background:var(--navy);color:var(--gold)}
.ph h1{font-size:36px;line-height:1.2;font-weight:800;letter-spacing:-.6px;margin:14px 0 12px}
.ph .lead{color:var(--muted);font-size:15px;max-width:720px;margin:0 auto}
.byline{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:12.5px;color:var(--muted)}
.byline i{color:var(--orange);margin-right:5px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.author-i{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:600}
.hero-img{margin-top:24px;border-radius:24px;aspect-ratio:21/7;max-height:400px;width:100%;background:radial-gradient(circle at 50% 55%,#fff 0,#DCE2F3 70%);box-shadow:var(--shadow)}
.hero-img img{height:84%;width:auto;max-width:80%}

/* Layout */
.pl{display:grid;grid-template-columns:240px minmax(0,1fr) 220px;gap:30px;margin-top:30px;align-items:start}
.pl>*{min-width:0}
.sticky{position:sticky;top:150px;display:grid;gap:16px}
.toc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.toc h4,.sharebox h4{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:10px;font-weight:600}
.toc ol{list-style:none;display:grid;gap:2px;counter-reset:t}
.toc ol a{display:flex;gap:10px;font-size:13px;padding:7px 8px;border-radius:8px;color:var(--text);line-height:1.4;transition:.2s}
.toc ol a::before{counter-increment:t;content:counter(t,decimal-leading-zero);color:var(--orange);font-weight:700;font-size:11.5px;padding-top:1px}
.toc ol a:hover,.toc ol a.on{background:var(--orange-soft);color:var(--orange)}
.share{display:flex;gap:8px;flex-wrap:wrap}
.share button{width:40px;height:40px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:15px;transition:.2s}
.share button:hover{background:var(--navy);color:#fff;border-color:var(--ink)}
.share .fb:hover{background:#1877F2;border-color:#1877F2}
.share .wa:hover{background:#25D366;border-color:#25D366}

/* Article */
.article{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:36px 40px;font-size:15.5px;line-height:1.85;color:#2A3050}
.article h2{font-size:22px;line-height:1.35;color:var(--text);font-weight:700;margin:30px 0 12px;scroll-margin-top:150px;letter-spacing:-.2px}
.article h2:first-child{margin-top:0}
.article p{margin-bottom:16px}
.article b{color:var(--text)}
.article ul{margin:0 0 18px 0;list-style:none;display:grid;gap:8px}
.article ul li{position:relative;padding-left:26px}
.article ul li::before{content:"\f00c";font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;left:0;top:1px;color:var(--orange);font-size:13px}
.tip{display:flex;gap:14px;background:var(--orange-soft);border-left:4px solid var(--orange);border-radius:12px;padding:16px 18px;margin:6px 0 20px;font-size:14px;line-height:1.7}
.tip i{color:var(--orange);font-size:18px;margin-top:3px}
.verdict{background:linear-gradient(135deg,var(--navy),var(--navy-3));color:#D5D9EE;border-radius:16px;padding:22px 24px;margin:8px 0 18px;font-size:14.5px}
.verdict b{color:var(--gold);display:block;font-size:12px;letter-spacing:1.5px;margin-bottom:6px}
.tbl{overflow-x:auto;margin:0 0 20px;border:1px solid var(--line);border-radius:12px}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:460px}
.tbl th,.tbl td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{background:var(--bg);font-weight:600;color:var(--text)}
.tbl tr:last-child td{border-bottom:0}
.inline-prod{margin:8px 0 26px;padding:20px;border-radius:16px;background:var(--soft);border:1px dashed #D5DAEA}
.inline-prod h5{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:12px;font-weight:600}
.inline-prod .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.art-tags{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px;margin-top:10px}
.art-tags a{font-size:12px;padding:5px 12px;border-radius:20px;background:var(--soft-2);color:var(--text);line-height:1.5}
.art-tags a:hover{background:var(--orange);color:#fff}

.side-prods{display:grid;gap:10px}
.sp{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;transition:.2s}
.sp:hover{border-color:var(--orange)}
.sp .media{width:54px;height:54px;border-radius:9px}
.sp .media img{width:86%}
.sp b{font-size:11.5px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sp span{font-size:12.5px;font-weight:700;color:var(--orange)}

/* Author */
.author{display:flex;gap:18px;align-items:center;margin-top:22px}
.author .av{width:64px;height:64px;font-size:20px}
.author h4{font-size:16px}
.author p{font-size:13px;color:var(--muted);margin-top:4px}
.author .social a{background:var(--soft-2);color:var(--ink);width:34px;height:34px}
.author .social a:hover{background:var(--orange);color:#fff}

/* Prev / next */
.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
.pn a{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px;transition:.2s;min-width:0}
.pn a:hover{border-color:var(--orange);box-shadow:var(--shadow)}
.pn small{font-size:11.5px;color:var(--orange);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.pn b{font-size:14px;font-weight:600;line-height:1.4}
.pn .nx{text-align:right}
.pn .ph-empty{visibility:hidden}

/* Related */
.posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.post{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:.25s}
.post:hover{box-shadow:var(--shadow-h);transform:translateY(-4px)}
.post .media{aspect-ratio:16/10}
.post .body{padding:16px;display:flex;flex-direction:column;gap:8px}
.post h3{font-size:15px;font-weight:600;line-height:1.4}
.post h3 a:hover{color:var(--orange)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.meta i{color:var(--orange);margin-right:4px}
.cat.pill{background:var(--navy);color:var(--gold);align-self:flex-start}

/* Comments */
.cm-wrap{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.cm{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.cm:last-child{border-bottom:0}
.cm .av{background:linear-gradient(135deg,var(--navy),var(--navy-3))}
.cm b{font-size:13.5px}
.cm small{font-size:11.5px;color:var(--muted);margin-left:8px}
.cm p{font-size:13.5px;color:#3A4060;margin-top:4px;word-break:break-word}

@media (max-width:1200px){
  .pl{grid-template-columns:220px minmax(0,1fr)}
  .pl .right{display:none}
}
@media (max-width:992px){
  .pl{grid-template-columns:1fr}
  .sticky{position:static}
  .toc{order:0}
  .posts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cm-wrap{grid-template-columns:1fr}
}
@media (max-width:640px){
  .ph h1{font-size:24px}
  .ph .lead{font-size:13.5px}
  .byline{gap:10px 14px}
  .hero-img{aspect-ratio:4/3;border-radius:18px}
  .article{padding:22px 18px;font-size:14.5px;line-height:1.8}
  .article h2{font-size:18px}
  .inline-prod{padding:12px}
  .inline-prod .grid{gap:10px}
  .author{flex-direction:column;align-items:flex-start;gap:12px}
  .pn{grid-template-columns:1fr}
  .pn .nx{text-align:left}
  .posts{grid-template-columns:1fr}
}
</style>

      p:["Not sure which suits you? Try both in our PC Builder to compare total prices, or visit our Demo Tower store and our build team will help you plan it."]}
  ],
  4: [

    {h:"MageGee Captain87 in use", p:["The Captain87 is a compact TKL board with adjustable actuation from 0.1mm to 4.0mm per key. Typing feels smooth and linear, the gasket mount soaks up the hollow sound common in budget boards, and the software makes it easy to set lighter actuation on WASD and deeper actuation elsewhere to avoid typos."]},
    {prods:[6,7]},
    {h:"Should you buy it?", p:["At ৳6,300 the Captain87 brings a feature that cost three times as much two years ago. If you play competitive shooters, it is an easy recommendation. If you mostly type, a traditional hot-swappable board like the Furycube G87 is cheaper and just as pleasant."]}

    {h:"Gaming and work", p:["Ultrawide support is excellent in racing games, flight sims and most single-player titles. Motion is smooth at 180Hz with minimal dark-level smearing for a VA panel. For work, the extra width replaces a dual-monitor setup: two full-size windows side by side with no bezel in the middle."]},
    {prods:[3,4]},
    {h:"Verdict", p:["For ৳37,499 the G34WQ is one of the best-value ultrawides you can buy. If you want to go even wider, the 49-inch AOC AGON AG493QCX is essentially two 27-inch screens in one."]}
  ],
  7: [
    {h:"Now available", p:["Our Ryzen 5 7500F + RTX 5060 16GB DDR5 gaming PC is now in stock. NVIDIA's new mid-range card brings DLSS 4 with multi-frame generation, making high-refresh 1080p and comfortable 1440p gaming affordable."]},
    {h:"What's included", ul:["Official warranty on every component","Free assembly, cable management and stress testing","Windows-ready with the latest drivers installed","0% EMI on selected bank cards"]},
    {prods:[11,13]},

  ],

    {h:"Mounting and display", p:["A desk clamp works to start, but a wheel stand or cockpit stops flex under heavy braking. For visuals, a wide curved monitor wraps the track around your peripheral vision, which is a big help for judging corners."]},
    {prods:[5,4]},
    {h:"Games to start with", ul:["<b>Forza Horizon 5</b>: forgiving and fun to learn wheel control","<b>Assetto Corsa</b>: realistic physics and a huge mod scene","<b>F1 25</b>: full TRUEFORCE support and familiar tracks","<b>iRacing</b>: when you are ready for competitive online racing"]}
  ],
  9: [

    {prods:[8,9]},

const fmtDate = d => new Date(d + "T00:00:00").toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"});
const link = p => `blog-post.html?id=${p.id}`;
const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const idx = Math.max(0, POSTS.findIndex(p => p.id === +qp("id")));
const post = POSTS[idx];
const sections = BODY[post.id] || [{h:"Overview", p:[esc(post.x)]}];
document.title = post.t + " | TechStore BD";

$("#crumb").innerHTML = `<a href="index.html"><i class="fa-solid fa-house" style="font-size:11px"></i></a><i class="fa-solid fa-chevron-right"></i><a href="blog.html">Blog</a><i class="fa-solid fa-chevron-right"></i><a href="blog.html?cat=${encodeURIComponent(post.cat)}">${post.cat}</a><i class="fa-solid fa-chevron-right"></i><span>${esc(post.t.length > 40 ? post.t.slice(0, 40) + "…" : post.t)}</span>`;
$("#ph").innerHTML = `
  <a href="blog.html?cat=${encodeURIComponent(post.cat)}" class="pill">${post.cat}</a>
  <h1>${esc(post.t)}</h1>
  <p class="lead">${esc(post.x)}</p>
  <div class="byline">
    <span class="author-i"><span class="av">PC</span>TechStore Team</span>
    <span><i class="fa-regular fa-calendar"></i>${fmtDate(post.d)}</span>
    <span><i class="fa-regular fa-clock"></i>${post.r} min read</span>
    <span><i class="fa-regular fa-eye"></i>${post.v.toLocaleString("en-IN")} views</span>
  </div>`;
$("#heroImg").innerHTML = `<img src="img/${post.img}" alt="${esc(post.t)}">`;

// Article
const used = new Set();
let html = "";
sections.forEach(s => {
  if (s.h) html += `<h2 id="${slugify(s.h)}">${s.h}</h2>`;
  if (s.verdict) html += `<div class="verdict"><b>OUR VERDICT</b>${s.verdict}</div>`;
  (s.p || []).forEach(t => html += `<p>${t}</p>`);
  if (s.ul) html += `<ul>${s.ul.map(li => `<li>${li}</li>`).join("")}</ul>`;
  if (s.table) html += `<div class="tbl"><table><thead><tr>${s.table[0].map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${s.table.slice(1).map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if (s.tip) html += `<div class="tip"><i class="fa-solid fa-lightbulb"></i><div><b>Pro tip:</b> ${s.tip}</div></div>`;
  if (s.prods) { s.prods.forEach(i => used.add(i)); html += `<div class="inline-prod"><h5><i class="fa-solid fa-bag-shopping" style="color:var(--orange)"></i> Products mentioned</h5><div class="grid" data-ids="${s.prods.join(",")}"></div></div>`; }
});
html += `<div class="art-tags">${post.tags.map(t => `<a href="blog.html">#${esc(t)}</a>`).join("")}</div>`;
$("#article").innerHTML = html;
$$("#article .grid[data-ids]").forEach(g => fill(g, g.dataset.ids.split(",").map(Number).filter(i => P[i])));

// TOC with scroll-spy
const heads = $$("#article h2");
$("#toc").innerHTML = heads.map(h => `<li><a href="#${h.id}">${h.textContent}</a></li>`).join("");
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) $$("#toc a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
  }), {rootMargin: "-140px 0px -65% 0px"});
  heads.forEach(h => io.observe(h));
}

// Share
const url = location.href;
$("#share").innerHTML = `
  <button class="fb" data-s="fb" aria-label="Share on Facebook"><i class="fa-brands fa-facebook-f"></i></button>
  <button class="wa" data-s="wa" aria-label="Share on WhatsApp"><i class="fa-brands fa-whatsapp"></i></button>
  <button data-s="x" aria-label="Share on X"><i class="fa-brands fa-x-twitter"></i></button>
  <button data-s="copy" aria-label="Copy link"><i class="fa-solid fa-link"></i></button>`;
$("#share").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const u = encodeURIComponent(url), t = encodeURIComponent(post.t);
  const go = {fb:`https://www.facebook.com/sharer/sharer.php?u=${u}`, wa:`https://wa.me/?text=${t}%20${u}`, x:`https://twitter.com/intent/tweet?text=${t}&url=${u}`}[b.dataset.s];
  if (go) window.open(go, "_blank", "noopener");
  else if (navigator.clipboard?.writeText) navigator.clipboard.writeText(url).then(() => toast("Link copied"), () => toast("Couldn't copy link"));
  else toast("Copy the link from your address bar");
});

// Side products
$("#sideProds").innerHTML = (used.size ? [...used] : post.pr).filter(i => P[i]).slice(0, 4).map(i => `
  <a class="sp" href="product.html?id=${i}"><div class="media"><img src="img/${P[i].i}" alt=""></div><div><b>${esc(P[i].n)}</b><span>${tk(P[i].p)}</span></div></a>`).join("");

// Author
$("#author").innerHTML = `<span class="av">PC</span><div style="flex:1"><h4>TechStore Team</h4><p>Our in-house product specialists and PC builders test hundreds of laptops, monitors and components every year at our Demo Tower store to help you buy the right tech.</p></div>
  <div class="social" style="margin-top:0"><a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a><a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a></div>`;

// Prev / next (POSTS is newest first: "previous" = older)
const prev = POSTS[idx + 1], next = POSTS[idx - 1];
$("#pn").innerHTML =
  (prev ? `<a href="${link(prev)}"><small><i class="fa-solid fa-arrow-left"></i> Previous post</small><b>${esc(prev.t)}</b></a>` : `<a class="ph-empty" aria-hidden="true"></a>`) +
  (next ? `<a href="${link(next)}" class="nx"><small>Next post <i class="fa-solid fa-arrow-right"></i></small><b>${esc(next.t)}</b></a>` : "");

// Related: same category first, then shared tags
const score = p => (p.cat === post.cat ? 3 : 0) + p.tags.filter(t => post.tags.includes(t)).length;
$("#related").innerHTML = POSTS.filter(p => p.id !== post.id).sort((a, b) => score(b) - score(a)).slice(0, 3).map(p => `
  <article class="post">
    <a href="${link(p)}" class="media"><img src="img/${p.img}" alt="${esc(p.t)}" loading="lazy"></a>
    <div class="body"><span class="pill cat">${p.cat}</span>
      <div class="meta"><span><i class="fa-regular fa-calendar"></i>${fmtDate(p.d)}</span><span><i class="fa-regular fa-clock"></i>${p.r} min read</span></div>
      <h3><a href="${link(p)}">${esc(p.t)}</a></h3></div>
  </article>`).join("");

// Comments (store "comments": {postId: [{n, t, d}]})
const SEED = [{n:"Rafiul H.", t:"Very helpful, thanks! Does TechStore offer EMI on these?", d:"2026-10-15T10:20:00", seed:1}];
function renderComments(){
  const all = store.get("comments", {});
  const list = [...SEED, ...(all[post.id] || [])];
  $("#cmCount").textContent = list.length + " comment" + (list.length === 1 ? "" : "s");
  $("#cmList").innerHTML = list.slice().reverse().map(c => `
    <div class="cm"><span class="av">${esc(c.n.trim()[0] || "?").toUpperCase()}</span>
      <div><b>${esc(c.n)}</b><small>${new Date(c.d).toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"})}</small><p>${esc(c.t)}</p></div></div>`).join("");
}
$("#cmForm").addEventListener("submit", e => {
  e.preventDefault();
  const all = store.get("comments", {});
  (all[post.id] ||= []).push({n: $("#cmName").value.trim(), e: $("#cmEmail").value.trim(), t: $("#cmText").value.trim(), d: new Date().toISOString()});
  store.set("comments", all);
  e.target.reset(); renderComments(); toast("Comment posted");
});
renderComments();
</script>
</body>
</html>
