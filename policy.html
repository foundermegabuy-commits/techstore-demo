<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Policies – TechStore BD</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/style.css">
<style>
.pol-hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:34px 36px}
.pol-hero small{color:var(--gold);font-weight:600;letter-spacing:2px;font-size:12px}
.pol-hero h1{font-size:32px!important;margin-top:4px}
.pol-hero .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pol-hero .meta span{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:6px 13px;border-radius:30px;font-size:12px;color:#D5D9EE}
.pol-hero .meta i{color:var(--orange-2)}
.pol-hero .big{font-size:110px;color:rgba(255,255,255,.06);position:absolute;right:40px;top:50%;transform:translateY(-50%);pointer-events:none}
.pol-hero .acts{display:flex;gap:10px;position:relative;z-index:1}
.btn.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff}
.btn.glass:hover{background:rgba(255,255,255,.16)}

.pol{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start;margin-top:22px}
.pol-side{position:sticky;top:140px;display:grid;gap:14px}
.pol-nav{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.pol-nav h4{font-size:11.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:600;padding:8px 10px 10px}
.pol-nav a{display:flex;align-items:center;gap:12px;padding:10px;border-radius:11px;font-size:13.5px;font-weight:500;color:var(--text);transition:.2s;position:relative}
.pol-nav a i{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--soft-2);color:var(--ink);font-size:14px;transition:.2s}
.pol-nav a:hover{background:var(--soft)}
.pol-nav a.on{background:var(--orange-soft);color:var(--orange);font-weight:600}
.pol-nav a.on i{background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff}
.pol-nav a.on::after{content:"";position:absolute;right:10px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
.side-help{background:linear-gradient(150deg,var(--navy),var(--navy-3));color:#fff;border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.side-help::before{content:"";position:absolute;right:-50px;top:-50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(rgba(255,74,3,.45),transparent 65%)}
.side-help b{display:block;font-size:15px;position:relative}
.side-help p{font-size:12.5px;color:#B4BAD8;margin:4px 0 12px;position:relative}
.side-help a{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0;color:#fff;position:relative}
.side-help a i{color:var(--orange-2);width:16px}

.pol-main{display:grid;grid-template-columns:minmax(0,760px) 220px;gap:24px;align-items:start;justify-content:start}
.toc{position:sticky;top:140px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px;font-size:12.5px}
.toc h4{font-size:11.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.toc h4 button{display:none;color:var(--ink);font-size:12px}
.toc ol{list-style:none;display:grid;gap:2px;border-left:2px solid var(--line)}
.toc a{display:block;padding:6px 10px;margin-left:-2px;border-left:2px solid transparent;color:var(--muted);line-height:1.4;transition:.2s}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--orange);border-color:var(--orange);font-weight:600}

.doc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 44px;font-size:14.5px;line-height:1.8;color:#2A3150;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.doc .sample{display:flex;gap:10px;align-items:flex-start;background:#FFF8E6;border:1px dashed #E8C77A;color:#8A6A12;border-radius:12px;padding:10px 14px;font-size:12.5px;line-height:1.6;margin-bottom:24px}
.doc .sample i{margin-top:3px}
.doc .lead{font-size:16px;color:var(--text);line-height:1.75;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:8px}
.doc h2{font-size:19px;font-weight:700;color:var(--text);letter-spacing:-.2px;margin:34px 0 10px;display:flex;align-items:center;gap:12px;scroll-margin-top:150px}
.doc h2 .n{width:32px;height:32px;flex:none;border-radius:10px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-size:13px;font-weight:700}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{margin:0 0 14px;padding-left:22px}
.doc li{margin-bottom:6px}
.doc li::marker{color:var(--orange)}
.doc b,.doc strong{color:var(--text);font-weight:600}
.doc a{color:var(--orange);font-weight:500}
.doc a:hover{text-decoration:underline}
.call{display:flex;gap:14px;border-radius:14px;padding:14px 16px;margin:16px 0;font-size:13.5px;line-height:1.65}
.call i{font-size:17px;margin-top:3px;flex:none}
.call b{display:block;margin-bottom:2px}
.call.info{background:#EEF5FC;border-left:4px solid #0381C5}.call.info i{color:#0381C5}
.call.tip{background:#E9F7F0;border-left:4px solid var(--green)}.call.tip i{color:var(--green)}
.call.warn{background:var(--orange-soft);border-left:4px solid var(--orange)}.call.warn i{color:var(--orange)}
.tbl{overflow-x:auto;margin:14px 0 18px;border:1px solid var(--line);border-radius:14px}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:440px}
.tbl th{background:var(--navy);color:#fff;text-align:left;font-weight:600;padding:11px 14px;font-size:12.5px;letter-spacing:.3px}
.tbl td{padding:11px 14px;border-top:1px solid var(--line);color:var(--text)}
.tbl tr:nth-child(even) td{background:var(--soft)}
.tbl td.hl{color:var(--orange);font-weight:700}
.doc .contact-card{margin-top:30px;background:linear-gradient(135deg,var(--soft),var(--soft-2));border-radius:16px;padding:20px 22px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.doc .contact-card .ic{grid-row:span 3;width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff;display:grid;place-items:center;font-size:20px}
.doc .contact-card b{font-size:15px}
.doc .contact-card span{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;line-height:1.5}
.doc .contact-card span i{color:var(--orange);width:14px}
.doc .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:30px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.doc .foot a{display:inline-flex;align-items:center;gap:8px}

@media (max-width:1200px){
  .pol-main{grid-template-columns:minmax(0,1fr)}
  .toc{position:static;order:-1}
  .toc ol{grid-template-columns:1fr 1fr;border:0;gap:2px 14px}
  .toc a{border-left:0;padding:5px 0;margin:0}
}
@media (max-width:992px){
  .pol{grid-template-columns:minmax(0,1fr)}
  .pol-side{position:static}
  .pol-nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px}
  .pol-nav::-webkit-scrollbar{display:none}
  .pol-nav h4{display:none}
  .pol-nav a{white-space:nowrap;flex:none;padding:6px 12px 6px 6px;gap:8px;font-size:13px}
  .pol-nav a i{width:28px;height:28px;font-size:12px}
  .pol-nav a.on::after{display:none}
  .side-help{display:none}
}
@media (max-width:640px){
  .pol-hero{padding:24px 20px}.pol-hero h1{font-size:23px!important}.pol-hero .big{font-size:70px;right:10px;top:30%}
  .pol-hero .acts{width:100%}.pol-hero .acts .btn{flex:1;height:42px;padding:0 12px;font-size:13px}
  .doc{padding:22px 18px;font-size:14px;border-radius:16px}
  .doc .lead{font-size:14.5px}
  .doc h2{font-size:16.5px;gap:10px}.doc h2 .n{width:28px;height:28px;font-size:12px}
  .toc h4 button{display:block}
  .toc ol{grid-template-columns:1fr}
  .toc.closed ol{display:none}
  .toc.closed h4{margin-bottom:0}
  .doc .contact-card{grid-template-columns:1fr}.doc .contact-card .ic{grid-row:auto}
}
@media print{
  .topbar,header.main,.mobile-menu,.news,footer,.fab,.toast,.crumb,.pol-side,.toc,.pol-hero .acts,.doc .foot{display:none!important}
  body{background:var(--card)}
  .pol-hero{background:none!important;color:#000;padding:0}.pol-hero p,.pol-hero small{color:#333!important}.pol-hero .meta span{color:#333;border-color:#ccc}
  .pol,.pol-main{display:block}
  .doc{border:0;padding:0;animation:none}
  .tbl th{background:#eee;color:#000}
}
</style>
</head>

    sec: [
      ["Delivery charges", table(["Delivery area", "Charge", "Estimated time"], [["Inside Dhaka", "!৳60", "1–2 working days"], ["Outside Dhaka", "!৳120", "2–5 working days"], ["Store pickup (Demo Tower)", "!Free", "Same day after confirmation"]]) +
        call("tip", "fa-gift", "Large items", "Extra charges may apply for heavy or oversized items such as desktop PC builds, large monitors and UPS units. Our team will confirm before dispatch.")],
      ["Order processing", `<p>Orders confirmed before <b>4 PM</b> are usually processed the same day. Orders placed on our weekly holiday (Tuesday) or public holidays are processed on the next working day.</p>`],
      ["Cash on delivery", `<p>Cash on delivery is available inside Dhaka and selected districts. For orders above a certain value, or outside Dhaka, a partial or full advance payment may be required.</p>`],
      ["Receiving your order", `<ul><li>Check the package for damage or tampering before accepting it.</li><li>Please open and check the product in front of the delivery person where possible.</li><li>If the box is damaged, refuse delivery and call us immediately at <a href="tel:01000000000">01000000000</a>.</li></ul>
        ${call("info", "fa-video", "Unboxing video", "We recommend recording a video while unboxing, as it helps us process any damage or missing-item claims.")}`],
      ["Tracking your order", `<p>You can follow your order status anytime from <a href="track-order.html">Track Order</a> using your order number and phone number. You will also receive SMS updates when your order is dispatched.</p>`],
      ["Delays", `<p>Delivery times are estimates. Weather, strikes, courier delays or remote locations may occasionally cause delays; we will keep you informed if this happens.</p>`]
    ]
  },
  original: {
    t: "100% Original Products", ic: "fa-certificate", d: "19 October 2026",
    s: "How we make sure every product you buy is genuine, new and covered by official warranty.",
    lead: "Every product sold by TechStore BD is brand new and sourced from the brand, its authorised distributor or official importer. We do not sell refurbished, grey-market or copy products as new.",
    sec: [
      ["Where our products come from", `<ul><li><b>Official brand partners</b> – we work directly with brands and their authorised distributors in Bangladesh.</li><li><b>Authorised distributor</b> – for several brands (for example Teclast) TechStore BD is an authorised distributor.</li><li><b>Sealed stock</b> – products arrive factory-sealed and are opened only for testing at your request.</li></ul>`],
      ["How to verify your product", `<ol><li>Check the <b>serial number</b> on the box matches the serial number on the product and your invoice.</li><li>Look for the brand's warranty sticker or warranty card where applicable.</li><li>Many brands let you check the serial number on their official website.</li></ol>
        ${call("tip", "fa-magnifying-glass", "Need help verifying?", "Bring the product to our Service Center (Level-8, Demo Tower) or call 01000000007 and our team will verify it for you.")}`],
      ["Our guarantee", `<p>If a product bought from TechStore BD is ever proven not to be genuine, we will <b>replace it with a genuine unit or refund the full amount</b>. This is in addition to the normal warranty and return policy.</p>`],
      ["Official warranty", `<p>Because every product is genuine, it carries the brand's official warranty. See our <a href="policy.html?p=warranty" data-p="warranty">Warranty Policy</a> for warranty periods and how to claim.</p>`],
      ["Open-box and demo units", `<p>Occasionally we may offer open-box or display units at a discount. These are always <b>clearly labelled</b> on the product page and invoice, and are never sold as new.</p>`]
    ]
  },
  payment: {
    t: "Secure Payment", ic: "fa-lock", d: "19 October 2026",
    s: "The payment methods we accept and how your payment information is protected.",
    lead: "You can pay for your order using mobile financial services, cards, bank transfer or cash on delivery. Online payments are processed by secure, licensed payment gateways – TechStore BD never sees or stores your full card details.",
    sec: [
      ["Accepted payment methods", table(["Method", "Details"], [["bKash / Nagad / Rocket", "Pay instantly from your mobile wallet at checkout"], ["Credit & debit card", "VISA, Mastercard and AMEX through a secure payment gateway"], ["0% EMI", "Available on eligible credit cards – see EMI Policy"], ["Cash on delivery", "Pay the delivery person when you receive your order"], ["Store payment", "Cash, card or mobile wallet at any TechStore BD branch"]])],
      ["How your payment is protected", `<ul><li><b>Encrypted connection</b> – all checkout pages use HTTPS/SSL encryption.</li><li><b>No stored card data</b> – card details are entered on the payment gateway's secure page, not on our servers.</li><li><b>OTP verification</b> – card and wallet payments are confirmed with a one-time password sent to you.</li></ul>
        ${call("info", "fa-shield-halved", "Stay safe", "TechStore BD staff will never ask for your card PIN, OTP or wallet PIN by phone, SMS or social media.")}`],
      ["Cash on delivery", `<p>Cash on delivery is available inside Dhaka and selected districts. For high-value orders or deliveries outside Dhaka, a partial or full advance payment may be required. See our <a href="policy.html?p=delivery" data-p="delivery">Delivery Policy</a>.</p>`],
      ["Failed or double payments", `<p>If money was deducted but your order was not confirmed, or you were charged twice, contact us with your transaction ID. Verified extra payments are refunded to the original payment method, usually within <b>7–10 working days</b>.</p>`],
      ["Invoices", `<p>A digital invoice is sent after your order is confirmed, and a printed invoice is included with your delivery. Keep it safe – it is needed for warranty claims.</p>`]
    ]
  }
};
const ORDER = ["original", "payment", "privacy", "terms", "refund", "emi", "warranty", "delivery"];
const NAVLBL = {privacy:"Privacy Policy", terms:"Terms & Conditions", refund:"Return & Refund", emi:"EMI Policy", warranty:"Warranty Policy", delivery:"Delivery Policy", original:"100% Original", payment:"Secure Payment"};

$("#polNav").insertAdjacentHTML("beforeend", ORDER.map(k => `<a href="policy.html?p=${k}" data-p="${k}"><i class="fa-solid ${POL[k].ic}"></i>${esc(NAVLBL[k])}</a>`).join(""));

const slug = s => s.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
let spy;
function render(key, push){
  if (!POL[key]) key = "privacy";
  const x = POL[key];
  document.title = x.t + " – TechStore BD";
  $("#polTitle").textContent = x.t; $("#crumbT").textContent = x.t; $("#polSub").textContent = x.s; $("#polDate").textContent = x.d;
  $("#heroIc").className = "fa-solid " + x.ic + " big";
  $$("#polNav a").forEach(a => { const on = a.dataset.p === key; a.classList.toggle("on", on); on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"); });

  const doc = $("#doc");
  doc.innerHTML = `<div class="sample"><i class="fa-solid fa-circle-exclamation"></i><span><b>Note:</b> Sample policy text – replace with TechStore BD's official policy.</span></div>
    <p class="lead">${x.lead}</p>
    ${x.sec.map(([h, body], i) => `<h2 id="${slug(h)}"><span class="n">${String(i + 1).padStart(2, "0")}</span>${esc(h)}</h2>${body}`).join("")}
    <h2 id="contact-us"><span class="n">${String(x.sec.length + 1).padStart(2, "0")}</span>Contact us</h2>
    <p>If you have any questions about this policy, please get in touch with our customer support team.</p>
    <div class="contact-card"><div class="ic"><i class="fa-solid fa-headset"></i></div><b>TechStore BD Customer Care</b>
      <span><i class="fa-solid fa-phone"></i><a href="tel:01000000000">01000000000</a></span>
      <span><i class="fa-solid fa-location-dot"></i>Dhaka-1205</span></div>
    <div class="foot"><span>Last updated: ${x.d}</span><a href="#top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false"><i class="fa-solid fa-arrow-up"></i> Back to top</a></div>`;
  doc.style.animation = "none"; void doc.offsetWidth; doc.style.animation = "";

  const words = doc.textContent.trim().split(/\s+/).length;
  $("#polRead").textContent = Math.max(1, Math.round(words / 200));

  const hs = $$("h2", doc);
  $("#tocList").innerHTML = hs.map(h => `<li><a href="#${h.id}" data-id="${h.id}">${esc(h.textContent.replace(/^\d+/, ""))}</a></li>`).join("");

  if (spy) spy.disconnect();
  spy = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) $$("#tocList a").forEach(a => a.classList.toggle("on", a.dataset.id === e.target.id)); });
  }, {rootMargin: "-150px 0px -65% 0px"});
  hs.forEach(h => spy.observe(h));
  const first = $("#tocList a"); if (first) first.classList.add("on");

  if (push) {
    history.pushState({p: key}, "", "policy.html?p=" + key);
    window.scrollTo({top: Math.min(window.scrollY, $(".pol-hero").offsetTop), behavior: "smooth"});
  }
}

document.addEventListener("click", e => {
  const a = e.target.closest("a[data-p]");
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  const k = a.dataset.p;
  if (k !== (qp("p") || "privacy")) render(k, true);
});
$("#tocList").addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a) return;
  e.preventDefault();
  document.getElementById(a.dataset.id).scrollIntoView({behavior: "smooth"});
  if (innerWidth <= 640) $("#toc").classList.add("closed");
});
$("#tocBtn").addEventListener("click", () => $("#toc").classList.toggle("closed"));
if (innerWidth <= 640) $("#toc").classList.add("closed");
window.addEventListener("popstate", () => render(qp("p"), false));
$("#copyLink").addEventListener("click", () => {
  const url = location.href.split("#")[0];
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast("Link copied to clipboard"), () => toast("Copy failed – use the address bar"));
});

render(qp("p"), false);
if (location.hash) setTimeout(() => { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }, 50);
</script>
</body>
</html>
